[package]
name = "e-probe-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4.42"
eframe = "0.32.3"
egui_file = "0.23.1"
goblin = "0.10.1"
probe-rs = "0.29.1"

[profile.dev]
codegen-units = 1   # better optimizations
debug = true        # symbols are nice and they don't increase the size on Flash
lto = true          # better optimizations
opt-level = 1
incremental = false

[profile.release]
codegen-units = 1   # better optimizations
lto = true          # better optimizations
strip = true
opt-level = 3
incremental = false
